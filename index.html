function termLines(log,fresh){
  if(!log.length) return `<div class="tl idle"># Ten krok niczego nie uruchamia. Przeczytaj opis obok.</div>`;
  return log.filter(r=>r.kind!=='skip').map((r,i)=>{
    const st=fresh?` style="animation-delay:${i*0.12}s"`:''; const nw=fresh?' new':'';
    if(r.kind==='note'&&!r.line.startsWith('git')) return `<div class="tl note${nw}"${st}>${esc(r.out)}</div>`;
    return `<div class="tl${nw}"${st}><span class="pr${r.who==='ola'?' ola':''}">${esc(r.prompt)}</span> <span class="cm">${esc(r.line)}</span></div>`+(r.out?`<div class="tl ${r.kind==='err'?'err':'out'}${nw}"${st}>${esc(r.out)}</div>`:'<div class="tl out"></div>');
  }).join('');
}
function renderLesson(ch){
  const idx=CH.indexOf(ch);
  const stepKey='step:'+ch.id; let step=Math.min(store.get(stepKey,0),ch.steps.length-1);
  $('#main').innerHTML=`<section class="lesson">
    <div class="lhead"><p class="eyebrow">${groupOf(ch.id)} · rozdział ${idx} z ${ALL.length-1}</p><h1>${ch.title}</h1><p class="lead">${ch.lead}</p></div>
    <div class="stage" id="stage">${panelsHTML(ch.panels,true)}</div>
    <div class="narr">

    </div></section>`;
  const P=makePanels($('#stage'),ch.panels);
  let first=true;
  const show=(k,dir)=>{
    step=Math.max(0,Math.min(ch.steps.length-1,k)); store.set(stepKey,step);

    updatePanels(P,s,{animate:!first});

    const last=step===ch.steps.length-1; const nextCh=ALL[idx+1];
    $('#stept').innerHTML=`<p class="stepnum">KROK ${step+1} / ${ch.steps.length}</p><h2>${st.t}</h2><div class="body">${st.b}</div>
      ${st.quiz?quizHTML(st.quiz):''}
      <div class="ctrl"><button class="btn ghost" id="prev" ${step===0?'disabled':''}>← Wstecz</button>
        <div class="dots">${ch.steps.map((_,i)=>`<button aria-label="Krok ${i+1}" class="${i===step?'on':i<step?'past':''}" data-i="${i}"></button>`).join('')}</div>
        <span class="sp"></span>
        ${last?(nextCh?`<a class="btn" href="#${nextCh.id}">${nextCh.title} →</a>`:''):`<button class="btn" id="next">Dalej →</button>`}
      </div>`;
    $('#prev').onclick=()=>show(step-1,-1);
    const nb=$('#next'); if(nb) nb.onclick=()=>show(step+1,1);
    document.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>show(+b.dataset.i));
    if(st.quiz) bindQuiz(st.quiz,()=>markDone(ch.id));
    $('#toSb').onclick=()=>{ const c=ensureTeam(structuredClone(s)); c.mode='sandbox'; sbKey='sandbox2'; sandboxState=c; sandboxLog={ty:[{kind:'note',line:'',out:`# Wczytano stan z rozdziału „${ch.title}”, krok ${step+1}. Pisz dalej własne polecenia.`}],ola:[]}; saveSandbox(); location.hash='piaskownica'; };
    if(dir&&first===false){ const r=$('#stage').getBoundingClientRect(); if(r.top<0) $('#stage').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'}); }
    first=false;
  };
  show(step);
  document.onkeydown=e=>{ if(e.target.closest('input,textarea'))return; if(e.key==='ArrowRight'&&step<ch.steps.length-1){show(step+1,1);} if(e.key==='ArrowLeft'&&step>0){show(step-1,-1);} };
}

  {t:'Jako Aleksandra pobierz twój PR do siebie (gh pr checkout) i poproś o zmiany.',ok:s=>!!s.flags.reviewerCheckout&&(s.prs||[]).some(p=>p.reviews.some(r=>r.by==='ola'&&r.state==='CHANGES_REQUESTED')),
   h:[['ola','gh pr list'],['ola','gh pr checkout 1'],['ola','gh pr review 1 --request-changes -b "Popraw opis"']],n:'Numer PR odczytasz z gh pr list albo z karty pod GitHubem.'},
  {t:'Wypchnij poprawkę, a potem zatwierdź PR jako Aleksandra.',ok:s=>(s.prs||[]).some(p=>p.reviews.some(r=>r.by==='ola'&&r.state==='APPROVED')),
   h:[['ty','git switch funkcja'],['ty','git commit -m "Poprawka"'],['ty','git push'],['ola','git pull'],['ola','gh pr review 1 --approve']],n:'Poprawkę robisz na tej samej gałęzi. PR zaktualizuje się sam.'},
  {t:'Scal PR i zsynchronizuj swoje main (git pull).',ok:s=>(s.prs||[]).some(p=>p.status==='merged'&&s.local.branches.main&&anc(s,s.local.branches.main).has(p.mergeId)),
   h:[['ola','gh pr merge 1 --merge --delete-branch'],['ty','git switch main'],['ty','git pull'],['ty','git branch -d funkcja'],['ty','git fetch --prune']],n:'Scalić można tylko PR zatwierdzony przez kogoś innego niż autor.'},
  {t:'Przenieś dowolną gałąź na koniec main poleceniem rebase.',ok:s=>!!s.flags.rebased,
   h:[['ty','git switch main'],['ty','git switch -c test'],['ty','git commit -m "Zmiana na gałęzi"'],['ty','git switch main'],['ty','git commit -m "Zmiana na main"'],['ty','git switch test'],['ty','git rebase main']],n:'Na main musi być commit, którego gałąź nie ma. Inaczej Git odpowie „up to date”.'},
  {t:'Cofnij dowolny commit bezpiecznie, bez przepisywania historii.',ok:s=>!!s.flags.reverted,
   h:[['ty','git switch main'],['ty','git commit -m "Pomyłka"'],['ty','git revert HEAD']],n:'Symulator nie cofa merge commitów, więc wskaż zwykły commit.'},
];
const CHEAT=['git status','git log --oneline --all','git commit -m "Opis"','git push','git pull','git pull --rebase','git switch -c funkcja','git switch main','git push -u origin funkcja','gh pr create','gh pr list','gh pr view 1','gh pr checkout 1','gh pr review 1 --request-changes -b "Popraw to"','gh pr review 1 --approve','gh pr merge 1 --merge --delete-branch','git fetch --prune','git branch -d funkcja','git merge funkcja','git rebase main','git revert HEAD','git reset --hard HEAD~1','git reflog','edit plik.txt','git add .','pomoc','reset'];
const HELP=`Obsługiwane polecenia (symulacja):
  git status | log [--all] | add <plik|.> | restore [--staged] <plik>
  git commit [-a] [-m "opis"] | branch [-d] [nazwa] | switch [-c] <gałąź>
  git checkout [-b] <gałąź|commit> | merge <ref> | rebase <ref> | cherry-pick <ref>
  git reset [--soft|--mixed|--hard] <ref> | revert <ref> | reflog
  git clone <url> | push [-u origin <gałąź>] | fetch [--prune] | pull [--rebase]
GitHub CLI (pull requesty):
  gh pr create [--title "..."] [--body "..."]   gh pr list   gh pr view [nr]
  gh pr checkout <nr>   gh pr review <nr> --approve | --request-changes -b "..." | --comment -b "..."
  gh pr merge <nr> [--merge|--squash] [--delete-branch]   gh pr close <nr>
Dodatkowe:
  edit <plik>   udaje zmianę pliku      clear   czyści ten terminal      reset   zaczyna od nowa
Lewy terminal jest twój, prawy należy do Aleksandry. Gałąź main jest chroniona:
PR scalisz dopiero po zatwierdzeniu przez drugą osobę.
Referencje: nazwy gałęzi, origin/main, HEAD, HEAD~2, HEAD^, ORIG_HEAD, skrót hasha.`;
function renderSandbox(mode){
  const tasks=mode==='tasks'; sbKey=tasks?'tasks2':'sandbox2'; loadSandbox(); const page=tasks?TASKSPAGE:SANDBOX;
  const termHTML=(who,label)=>`<div class="term sbterm ${who}" data-who="${who}"><div class="term-h"><i></i><i></i><i></i><span>${label}</span></div><div class="term-b"></div>
    <form class="tform"><span class="pr${who==='ola'?' ola':''}"></span><input id="tin-${who}" aria-label="Polecenie: ${label}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${who==='ola'?'gh pr list':'git status'}"></form></div>`;
  $('#main').innerHTML=`<section class="lesson">
    <div class="lhead"><p class="eyebrow">Praktyka · rozdział ${ALL.indexOf(page)} z ${ALL.length-1}</p><h1>${page.title}</h1><p class="lead">${tasks?'Siedem zadań do wykonania po kolei. Masz dwa terminale: swój i Aleksandry. Jeśli utkniesz, kliknij żarówkę, a zobaczysz wszystkie potrzebne polecenia.':'Masz dwa terminale: swój i Aleksandry. Oboje macie sklonowane to samo repozytorium z GitHuba. Wpisuj polecenia za siebie i za nią: otwieraj pull requesty, recenzuj je w jej imieniu i obserwuj, jak zmiany przechodzą między trzema repozytoriami.'}</p></div>
    <div class="stage" id="stage">${panelsHTML(['local','remote','peer'])}</div>
    <div class="terms">${termHTML('ty','Ty · terminal')}${termHTML('ola','Aleksandra · terminal')}</div>
    <div class="sbgrid">
      ${tasks?'<div class="card taskcard" id="taskcard" aria-live="polite"></div>':''}
      <div class="cheatwrap"><div class="row sbbtns"><button class="btn ghost" id="cheatBtn" aria-expanded="false" aria-controls="cheatBox">Pokaż ściągę</button><button class="btn ghost" id="sbReset">${tasks?'Zacznij zadania od nowa':'Resetuj piaskownicę'}</button></div><div id="sbResetBox"></div>
        <div class="card" id="cheatBox" hidden><h3>Ściąga</h3><p class="small" style="margin:0 0 8px">Kliknij polecenie, żeby wpisać je do ostatnio używanego terminala (podświetlonego).</p><div class="cheat">${CHEAT.map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
        <p class="small" style="margin:12px 0 0">To symulator: pliki nie mają treści, a commit bez zmian w poczekalni udaje jedną zmienioną linijkę. Ruch gałęzi i zasady GitHuba działają jak naprawdę. Wpisz <code>pomoc</code>, żeby zobaczyć wszystkie polecenia.</p></div></div>
    </div></section>`;
  const P=makePanels($('#stage'),['local','remote','peer']);
  const T={}; let active='ty'; const openHints=new Set();
  const doneNow=()=>TASKS.map(t=>t.ok(sandboxState));
  let curTask=Math.max(0,doneNow().indexOf(false)); if(doneNow().every(Boolean)) curTask=TASKS.length-1;
  let prevDone=doneNow(), justDone=-1;
  const bulb='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a4.5 4.5 0 0 0-2.6 8.2c.4.3.6.7.6 1.2V12h4v-1.1c0-.5.2-.9.6-1.2A4.5 4.5 0 0 0 8 1.5z" fill="currentColor" opacity=".9"/><path d="M6 13.5h4M6.7 15h2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  const renderTasks=()=>{ if(!tasks) return;
    const d=doneNow(); d.forEach((v,i)=>{ if(v&&!prevDone[i]) justDone=i; }); prevDone=d;
    const N=TASKS.length, nDone=d.filter(Boolean).length, t=TASKS[curTask], ok=d[curTask], open=openHints.has(curTask);
    const next=d.findIndex((v,i)=>!v&&i>curTask), anyNext=next>=0?next:d.indexOf(false);
    $('#taskcard').innerHTML=`<div class="tc-top"><h3>Zadanie ${curTask+1} z ${N}</h3><span class="small">Ukończone: ${nDone} z ${N}</span></div>
      <div class="tc-dots">${TASKS.map((_,i)=>`<button class="${d[i]?'ok':''}${i===curTask?' on':''}" data-i="${i}" aria-label="Zadanie ${i+1}${d[i]?', ukończone':''}"></button>`).join('')}</div>
      <div class="tc-main"><p class="tc-text">${t.t}</p><button class="hintbtn${open?' on':''}" id="hintBtn" aria-expanded="${open}" aria-label="Pokaż podpowiedź" title="Podpowiedź">${bulb}</button></div>
      ${ok?`<p class="tc-ok">${justDone===curTask?'Brawo, zadanie zaliczone!':'To zadanie jest już zaliczone.'}${nDone===N?' Wszystkie zadania gotowe.':''}</p>`:''}
      ${open?`<div class="hint" role="note"><p class="hint-h">Wpisz po kolei (kliknij polecenie, żeby wstawić je do terminala):</p><div class="hint-l">${t.h.map(([w,c])=>`<button data-who="${w}" data-c="${esc(c)}"><span class="hw ${w}">${w==='ola'?'Aleksandra':'Ty'}</span><code>${esc(c)}</code></button>`).join('')}</div>${t.n?`<p class="hint-n">${t.n}</p>`:''}</div>`:''}
      <div class="tc-nav"><button class="btn ghost" id="tPrev" ${curTask===0?'disabled':''}>← Poprzednie</button><span class="sp"></span>
        ${curTask<N-1?`<button class="btn${ok?'':' ghost'}" id="tNext">${ok&&anyNext>curTask?'Następne zadanie →':'Następne →'}</button>`:''}</div>`;
    const go=i=>{curTask=i; justDone=-1; renderTasks();};
    $('#tPrev').onclick=()=>go(curTask-1);
    const nb=$('#tNext'); if(nb) nb.onclick=()=>go(ok&&next>curTask?next:curTask+1);
    document.querySelectorAll('.tc-dots button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
    $('#hintBtn').onclick=()=>{openHints.has(curTask)?openHints.delete(curTask):openHints.add(curTask); renderTasks();};
    document.querySelectorAll('.hint-l button').forEach(b=>b.onclick=()=>{const w=b.dataset.who; T[w].inp.value=b.dataset.c; T[w].inp.focus();});
  };
  document.querySelectorAll('.sbterm').forEach(el=>{const who=el.dataset.who; T[who]={el,body:el.querySelector('.term-b'),pr:el.querySelector('.tform .pr'),inp:el.querySelector('input'),hist:[],hi:0};});
  const setActive=who=>{active=who; for(const k in T) T[k].el.classList.toggle('active',k===who);};
  const lineHTML=(r,nw)=>{
    if(r.kind==='note'&&!(r.line||'').startsWith('git')) return `<div class="tl note${nw}">${esc(r.out)}</div>`;
    return `<div class="tl"><span class="pr${r.who==='ola'?' ola':''}">${esc(r.prompt)}</span> <span class="cm">${esc(r.line)}</span></div>`+(r.out?`<div class="tl ${r.kind==='err'?'err':'out'}${nw}">${esc(r.out)}</div>`:'<div class="tl out"></div>');
  };
  const paint=(freshWho)=>{
    for(const who of ['ty','ola']){ const t=T[who], log=sandboxLog[who];
      t.body.innerHTML=(log.length?'':`<div class="tl idle">${who==='ty'?'Twój terminal. Wpisz polecenie albo kliknij coś ze ściągi.':'Terminal Aleksandry. Wszystko, co tu wpiszesz, wykona ona na swoim laptopie.'}</div>`)+log.map((r,i)=>lineHTML(r,(freshWho===who&&i===log.length-1)?' new':'')).join('');
      t.body.scrollTop=t.body.scrollHeight; t.pr.textContent=withUser(sandboxState,who,()=>promptOf(sandboxState)); }
    renderTasks();
  };
  const exec=(who,line)=>{
    line=line.trim(); if(!line) return; const t=T[who];
    t.hist.push(line); t.hi=t.hist.length;
    if(line==='clear'){sandboxLog[who]=[];paint();saveSandbox();return;}
    if(line==='reset'){resetSb();return;}
    if(line==='pomoc'||line==='help'||line==='git help'){sandboxLog[who].push({kind:'out',who,prompt:withUser(sandboxState,who,()=>promptOf(sandboxState)),line,out:HELP});paint(who);return;}
    const r=run(sandboxState,(who==='ola'?'ola: ':'ty: ')+line.replace(/^(ola|aleksandra|ty):\s*/i,'')); if(r.kind==='skip') return;
    sandboxLog[who].push(r); updatePanels(P,sandboxState,{animate:true}); paint(who); saveSandbox();
  };
  for(const who in T){ const t=T[who];
    t.el.querySelector('form').onsubmit=e=>{e.preventDefault(); exec(who,t.inp.value); t.inp.value='';};
    t.inp.onfocus=()=>setActive(who);
    t.inp.onkeydown=e=>{ if(e.key==='ArrowUp'&&t.hist.length){t.hi=Math.max(0,t.hi-1);t.inp.value=t.hist[t.hi];e.preventDefault();} if(e.key==='ArrowDown'){t.hi=Math.min(t.hist.length,t.hi+1);t.inp.value=t.hist[t.hi]||'';e.preventDefault();} };
  }
  document.querySelectorAll('.cheat button').forEach(b=>b.onclick=()=>{const inp=T[active].inp; inp.value=b.dataset.c; inp.focus(); for(const w of ['Opis','Popraw to']){const i=b.dataset.c.indexOf(w); if(i>=0){inp.setSelectionRange(i,i+w.length);break;}} });
  function resetSb(){sandboxState=freshSandbox();sandboxLog={ty:[{kind:'note',line:'',out:'# Zaczynacie od nowa: świeże klony z jednym commitem.'}],ola:[]};for(const k in P) if(P[k].shown!==undefined) P[k].shown=null;updatePanels(P,sandboxState,{animate:false});paint();saveSandbox();}
  $('#sbReset').onclick=()=>{ const box=$('#sbResetBox'); $('#sbReset').disabled=true;
    box.innerHTML=`<div class="confirm" role="alertdialog" aria-label="Potwierdź reset piaskownicy"><p>${tasks?'Zacząć zadania od nowa?':'Zresetować piaskownicę?'}</p><button class="btn danger">Tak</button><button class="btn ghost small">Nie</button></div>`;
    const [yes,no]=box.querySelectorAll('button'); const close=()=>{box.innerHTML='';$('#sbReset').disabled=false;$('#sbReset').focus();};
    no.onclick=close; no.focus(); yes.onclick=()=>{ resetSb(); close(); }; };
  $('#cheatBtn').onclick=()=>{const box=$('#cheatBox'); box.hidden=!box.hidden; $('#cheatBtn').textContent=box.hidden?'Pokaż ściągę':'Ukryj ściągę'; $('#cheatBtn').setAttribute('aria-expanded',String(!box.hidden));};
  setActive('ty'); updatePanels(P,sandboxState,{animate:false}); paint();
}

route();
</script>
